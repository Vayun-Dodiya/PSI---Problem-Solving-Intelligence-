<!DOCTYPE html>

<body data-page="profile">
  <div class="page">
    <header class="navbar" id="navbar">
      <div class="navbar__inner">
        <a class="navbar__brand" href="/" aria-label="PSI home">
          <img class="navbar__logo" src="/static/assets/icons/PSI-ICON.png" alt="" width="32" height="32" />

        </a>

        <nav class="navbar__nav" id="primary-nav" aria-label="Primary">
          <a class="navbar__link" data-nav="home" href="/">Home</a>

          <a class="btn btn--primary btn--sm" href="/analyze">Analyze</a>

              <span></span><span></span><span></span>

      <div class="profile">

    <footer class="footer">

        <div class="footer__brand">
          <div class="footer__logo-row">
            <img class="footer__logo" src="/static/assets/icons/PSI-ICON.png" alt="" width="28" height="28" />

        <nav class="footer__nav" aria-label="Footer">

          <a class="footer__link" href="/profile">Profile</a>
        </nav>
        <div class="footer__bottom">
          <span>© <span data-year></span> PSI — Problem Solving Intelligence</span>
          <span class="text-mono">V3</span>

      </div>
